[project]
name = "credit-decisioning-platform"
version = "1.0.0"
description = "Integrated credit decisioning platform: data pipeline, risk model, scoring API, monitoring and cloud-ready packaging for clinic and pharmacy lending."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # the formatter owns line length; long strings stay readable
